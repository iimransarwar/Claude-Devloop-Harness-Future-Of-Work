<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 372" width="400" height="372" role="img" aria-label="What the model reads each turn, top to bottom: devloop's fixed rules, devloop's fixed tools and the conversation so far form the cached part; your new prompt and a short devloop note with only what changed form the new part.">
<title>What the model reads each turn, top to bottom: devloop's fixed rules, devloop's fixed tools and the conversation so far form the cached part; your new prompt and a short devloop note with only what changed form the new part.</title>
<style>
  svg { --bg: #f5f7fa; --surface: #ffffff; --fg: #18212f; --muted: #586478;
    --you-bg: #fcefd2; --you-line: #a96f14; --agent-bg: #dde9fc; --agent-line: #2b62c4;
    --harness-bg: #d9f2ea; --harness-line: #1a7a63; --rev-bg: #ebe2fa; --rev-line: #6d41bb;
    --stop: #bf362e; --stop-bg: #fbe4e1; }
  @media (prefers-color-scheme: dark) { svg { --bg: #11151c; --surface: #19202a; --fg: #e5e9f0; --muted: #9ba6b7;
    --you-bg: #3a2d10; --you-line: #e0a84a; --agent-bg: #15284a; --agent-line: #70a2f3;
    --harness-bg: #10352d; --harness-line: #51c4a6; --rev-bg: #2a1f45; --rev-line: #aa8dec;
    --stop: #f1766d; --stop-bg: #3d1a17; } }
  text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--fg); }
  .ground { fill: var(--bg); }
  .t { font-size: 13px; font-weight: 600; }
  .s { font-size: 11px; fill: var(--muted); }
  .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 10.5px; fill: var(--muted); }
  .lbl { font-size: 11px; fill: var(--muted); }
  .cap { font-size: 10px; font-weight: 600; letter-spacing: 0.08em; fill: var(--harness-line); }
  .fl { font-size: 10.5px; fill: var(--stop); font-weight: 500; }
  .n { stroke-width: 1.5; }
  .you { fill: var(--you-bg); stroke: var(--you-line); }
  .agent { fill: var(--agent-bg); stroke: var(--agent-line); }
  .harness { fill: var(--harness-bg); stroke: var(--harness-line); }
  .rev { fill: var(--rev-bg); stroke: var(--rev-line); }
  .plain { fill: var(--surface); stroke: var(--muted); }
  .guard { fill: none; stroke: var(--harness-line); stroke-width: 1.5; stroke-dasharray: 5 4; }
  .a { stroke: var(--fg); stroke-width: 1.5; fill: none; }
  .ah { fill: var(--fg); }
  .f { stroke: var(--stop); stroke-width: 1.5; fill: none; }
  .fh { fill: var(--stop); }
  .pill { fill: var(--stop-bg); stroke: var(--stop); stroke-width: 1.5; }
  .pt { font-size: 10.5px; font-weight: 600; fill: var(--stop); }
  .br { stroke: var(--muted); stroke-width: 1.5; fill: none; }
  .cut { stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 4 4; }
  .bt { font-size: 12px; font-weight: 600; }
</style>
<rect class="ground" x="0" y="0" width="400" height="372" rx="8"/>
          <rect class="n harness" x="16" y="10" width="234" height="52"/>
          <text class="t" x="28" y="32">devloop rules</text>
          <text class="s" x="28" y="49">one fixed text, same bytes every time</text>
          <rect class="n harness" x="16" y="62" width="234" height="52"/>
          <text class="t" x="28" y="84">devloop tools</text>
          <text class="s" x="28" y="101">described once, never reworded</text>
          <rect class="n plain" x="16" y="114" width="234" height="84"/>
          <text class="t" x="28" y="150">Conversation so far</text>
          <text class="s" x="28" y="167">your prompts, the agent's work</text>

          <path class="br" d="M258 12 H266 V196 H258"/>
          <text class="bt" x="276" y="96">Cached</text>
          <text class="lbl" x="276" y="112">read back at</text>
          <text class="lbl" x="276" y="126">the low rate</text>

          <line class="cut" x1="6" y1="216" x2="394" y2="216"/>
          <text class="lbl" x="16" y="231">new this turn</text>

          <rect class="n you" x="16" y="240" width="234" height="52"/>
          <text class="t" x="28" y="262">Your new prompt</text>
          <text class="s" x="28" y="279">whatever you typed</text>
          <rect class="n harness" x="16" y="292" width="234" height="66"/>
          <text class="t" x="28" y="314">devloop note</text>
          <text class="s" x="28" y="331">only what changed since last turn,</text>
          <text class="s" x="28" y="345">capped (600 tokens by default)</text>

          <path class="br" d="M258 242 H266 V356 H258"/>
          <text class="bt" x="276" y="292">New</text>
          <text class="lbl" x="276" y="308">paid in full,</text>
          <text class="lbl" x="276" y="322">kept small</text>
        </svg>
